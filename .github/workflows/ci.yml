name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        id: install
        run: npm ci

      # The checks below run even if an earlier one fails, so one push shows
      # every problem. The job still fails if any of them fails.
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # next-env.d.ts and .next/types (PageProps, RouteContext) are generated, not committed.
        run: |
          npx next typegen
          npm run typecheck

      - name: Tests (solver, timeline, content, poses, API)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
